<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Dashboard - Chief Alltechs Ventures</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body onload="renderProducts()">
    <!-- Floating Navigation -->
    <nav class="nav-island reveal">
        <a href="index.html" class="nav-brand">CAV.</a>
        <ul class="nav-links">
            <li><a href="dashboard.html" class="active">Product DB</a></li>
            <li><a href="#" onclick="logout(); return false;">Logout</a></li>
        </ul>
        <button id="menuToggle" class="menu-toggle" aria-label="Toggle Menu">
            <span></span>
            <span></span>
        </button>
    </nav>

    <!-- Mobile Nav Overlay -->
    <div id="mobileNavOverlay" class="mobile-nav-overlay">
        <ul class="mobile-nav-links">
            <li><a href="dashboard.html" class="active">Product DB</a></li>
            <li><a href="#" onclick="logout(); return false;">Logout</a></li>
        </ul>
    </div>

    <section class="container" style="padding-top: 10rem;">
        <div class="text-center mb-8">
            <span class="eyebrow reveal">Database Systems</span>
            <h1 class="reveal delay-100">Product Manager</h1>
        </div>
        
        <div class="bento-grid mt-8">
            
            <!-- CRUD Form -->
            <div class="bento-item reveal delay-100" style="grid-column: span 4;">
                <div class="card-outer h-full">
                    <div class="card-inner">
                        <span class="eyebrow">Data Entry</span>
                        <h3 id="formTitle">Add New Product</h3>
                        
                        <form id="productForm" class="mt-8" onsubmit="return handleProductSave(event)">
                            <input type="hidden" id="productId">
                            
                            <div class="form-group">
                                <label for="productName">Product Name</label>
                                <input type="text" id="productName" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="productCategory">Category</label>
                                <select id="productCategory" required>
                                    <option value="">Select Category...</option>
                                    <option value="Networking">Networking</option>
                                    <option value="Servers">Servers</option>
                                    <option value="Security">Security</option>
                                    <option value="Storage">Storage</option>
                                    <option value="Software">Software</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="productBrand">Brand</label>
                                <input type="text" id="productBrand">
                            </div>
                            
                            <div class="flex gap-4">
                                <div class="form-group" style="flex: 1;">
                                    <label for="productPrice">Price (GHS)</label>
                                    <input type="number" id="productPrice" step="0.01" min="0" required>
                                </div>
                                <div class="form-group" style="flex: 1;">
                                    <label for="productQuantity">Quantity</label>
                                    <input type="number" id="productQuantity" min="0" required>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="productDesc">Description</label>
                                <textarea id="productDesc" rows="3"></textarea>
                            </div>
                            
                            <div class="flex items-center gap-4 mt-4">
                                <button type="submit" class="btn">
                                    <span id="submitBtnText">Add Record</span>
                                    <span class="btn-icon"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></span>
                                </button>
                                <button type="button" id="cancelBtn" class="btn btn-secondary hidden" onclick="resetProductForm()">
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
            <!-- Records Table -->
            <div class="bento-item reveal delay-200" style="grid-column: span 8;">
                <div class="card-outer h-full">
                    <div class="card-inner">
                        <div class="flex justify-between items-center" style="flex-wrap: wrap; gap: 1rem;">
                            <div>
                                <span class="eyebrow">Data View</span>
                                <h3>Product Records</h3>
                            </div>
                            <div style="width: 250px;">
                                <input type="text" placeholder="Search products..." oninput="handleSearch(event)" style="padding: 0.5rem 1rem; border-radius: var(--radius-pill);">
                            </div>
                        </div>
                        
                        <div class="mt-4 mb-4">
                            <!-- Requirement: Retrieve Record Button (though we also load on render) -->
                            <button class="btn btn-secondary" onclick="renderProducts()" style="padding: 0.25rem 1rem; font-size: 0.8rem;">
                                Refresh Table (Retrieve)
                            </button>
                        </div>
                        
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Category</th>
                                        <th>Brand</th>
                                        <th>Price</th>
                                        <th>Qty</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="productsBody">
                                    <!-- Populated via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </section>

    <footer class="container text-center" style="padding-bottom: 4rem; padding-top: 4rem; border-top: 1px solid var(--glass-border); margin-top: 4rem;">
        <p>&copy; 2026 Chief Alltechs Ventures (CAV). Designed by Group Members (UCC).</p>
    </footer>

    <script src="js/scripts.js"></script>
</body>
</html>
