<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAV - Database Portal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="global-nav">
        <a href="index.html" style="color: white; font-weight: 700;">CAV.</a>
        <div class="nav-links"></div>
    </nav>
    <div class="sub-nav-frosted">
        <span class="tagline">Secure Portal</span>
        <div class="sub-nav-links">
            <a href="index.html">Home</a>
            <a href="#" id="logoutBtn" onclick="handleLogout()" class="button-nav" style="display: none;">Logout</a>
        </div>
        <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sub-nav-links">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>
    </div>

    <!-- Login & Registration Section -->
    <section id="authSection" class="product-tile product-tile-dark" style="min-height: 80vh;">
        <div class="tile-content text-center" style="max-width: 440px; width: 100%;">
            
            <!-- Auth Toggle Header -->
            <div style="display: flex; justify-content: center; gap: 12px; margin-bottom: var(--spacing-md);">
                <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="button-secondary-pill" style="border-color: white; color: white; background: rgba(255,255,255,0.15);" aria-selected="true">Login</button>
                <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="button-secondary-pill" style="border-color: rgba(255,255,255,0.4); color: rgba(255,255,255,0.7);" aria-selected="false">Register</button>
            </div>

            <!-- Login Form -->
            <div id="loginCard" class="store-utility-card" style="text-align: left; background: var(--void-surface); border-color: var(--void-tile); color: white;">
                <h2 class="display-md mb-4" style="color: white; font-size: 28px;">Access Your Account</h2>
                <form onsubmit="return handleLogin(event);">
                    <div class="form-group">
                        <label for="username" style="color: var(--ink-muted);">Username</label>
                        <input type="text" id="username" class="form-input" required style="background: var(--void-black); color: white; border-color: var(--void-tile);">
                    </div>
                    <div class="form-group">
                        <label for="password" style="color: var(--ink-muted);">Password</label>
                        <input type="password" id="password" class="form-input" required style="background: var(--void-black); color: white; border-color: var(--void-tile);">
                    </div>
                    <span id="loginError" class="form-error" style="margin-bottom: 12px;"></span>
                    <button type="submit" class="button-primary" style="width: 100%;">Sign In</button>
                </form>
                <p class="caption mt-4" style="color: var(--ink-muted);">Demo credentials: admin / admin123</p>
            </div>

            <!-- Registration Form (Hidden by default) -->
            <div id="registerCard" class="store-utility-card" style="display: none; text-align: left; background: var(--void-surface); border-color: var(--void-tile); color: white;">
                <h2 class="display-md mb-4" style="color: white; font-size: 28px;">Create Your Account</h2>
                <form onsubmit="return handleRegister(event);">
                    <div class="form-group">
                        <label for="regFullName" style="color: var(--ink-muted);">Full Name</label>
                        <input type="text" id="regFullName" class="form-input" required style="background: var(--void-black); color: white; border-color: var(--void-tile);">
                    </div>
                    <div class="form-group">
                        <label for="regUsername" style="color: var(--ink-muted);">Username</label>
                        <input type="text" id="regUsername" class="form-input" required style="background: var(--void-black); color: white; border-color: var(--void-tile);">
                    </div>
                    <div class="form-group">
                        <label for="regPassword" style="color: var(--ink-muted);">Password</label>
                        <input type="password" id="regPassword" class="form-input" required style="background: var(--void-black); color: white; border-color: var(--void-tile);">
                    </div>
                    <div class="form-group">
                        <label for="regConfirm" style="color: var(--ink-muted);">Confirm Password</label>
                        <input type="password" id="regConfirm" class="form-input" required style="background: var(--void-black); color: white; border-color: var(--void-tile);">
                    </div>
                    <span id="regError" class="form-error" style="margin-bottom: 12px;"></span>
                    <button type="submit" class="button-primary" style="width: 100%;">Register</button>
                </form>
            </div>

        </div>
    </section>

    <!-- Dashboard Section -->
    <section id="dashboardSection" class="product-tile product-tile-parchment" style="display: none; min-height: 80vh; align-items: flex-start;">
        <div class="tile-content" style="width: 100%; max-width: 1200px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-md); flex-wrap: wrap; gap: 16px;">
                <div>
                    <h1 class="display-lg">Information System</h1>
                    <p id="userWelcome" class="caption" style="font-size: 16px; margin-top: 4px;"></p>
                </div>

                <!-- Retrieve Record Button Toolbar -->
                <div style="display: flex; gap: 12px; align-items: center;">
                    <button id="btnRetrieve" class="button-primary" onclick="retrieveRecords()">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                            <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/>
                        </svg>
                        Retrieve Records
                    </button>
                </div>
            </div>

            <!-- Status message for retrieval -->
            <div id="retrieveStatus" class="contact-success" style="display: none; margin-bottom: var(--spacing-md);">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                <span id="retrieveStatusText" class="body-strong" style="font-size: 14px;">Records retrieved successfully.</span>
            </div>
            
            <div class="store-grid" style="grid-template-columns: 1fr 2fr;">
                <!-- Form Area -->
                <div class="store-utility-card">
                    <h3 class="body-strong mb-4">Record Management</h3>
                    <input type="hidden" id="recordId">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="empName" class="form-input" placeholder="e.g. John Doe">
                    </div>
                    <div class="form-group">
                        <label>Role / Position</label>
                        <input type="text" id="empRole" class="form-input" placeholder="e.g. Systems Engineer">
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <select id="empDepartment" class="form-input">
                            <option value="IT Infrastructure">IT Infrastructure</option>
                            <option value="Cyber Security">Cyber Security</option>
                            <option value="Network Ops">Network Ops</option>
                            <option value="Administration">Administration</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: var(--spacing-sm); margin-top: var(--spacing-md); flex-wrap: wrap;">
                        <button id="btnAdd" class="button-primary" onclick="addRecord()" style="flex: 1;">Add Record</button>
                        <button id="btnUpdate" class="button-primary" onclick="updateRecord()" style="display:none; flex: 1; background: var(--ink-dark);">Update Record</button>
                        <button class="button-utility" onclick="resetForm()" style="background: transparent; color: var(--ink-dark); border: 1px solid var(--divider-light);">Clear</button>
                    </div>
                </div>

                <!-- Table Area -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Employee ID</th>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Department</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody">
                            <!-- JS populated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 Chief Alltechs Ventures (CAV). Designed by Group Members (UCC).</p>
    </footer>
    <script src="js/scripts.js"></script>
</body>
</html>
